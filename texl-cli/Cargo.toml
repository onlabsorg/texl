[package]
name = "texl-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "texl"
path = "src/main.rs"

[dependencies]
texl-core = { path = "../texl-core" }
swan-core = { path = "../swan-core" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["rt", "macros", "fs"] }
url = "2"
