[package]
name = "texl-cli"
version = "0.2.0"
edition = "2024"
description = "Renders Texl templates: text with Swan expressions in <% ... %> tags"
license = "MIT"
repository = "https://github.com/onlabsorg/texl"

[[bin]]
name = "texl"
path = "src/main.rs"

[dependencies]
texl-core = { path = "../texl-core" }
swan-core = { path = "../swan-core" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["rt", "macros", "fs"] }
url = "2"
