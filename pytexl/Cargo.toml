[package]
name = "pytexl"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/onlabsorg/texl"

[lib]
name = "_pytexl"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
url = "2"
swan-core = { path = "../swan-core" }
texl-core = { path = "../texl-core" }

[build-dependencies]
pyo3-build-config = "0.30"
