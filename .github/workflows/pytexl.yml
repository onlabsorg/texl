# Builds the pytexl wheels and sdist, tests the wheels, and publishes them to PyPI.
#
# Based on the workflow generated by `maturin generate-ci github -m pytexl/Cargo.toml`
# (maturin 1.15), trimmed to the platforms below. The module is abi3-py310, so each
# platform needs a single wheel for every Python version from 3.10.
#
# Pushing a tag like pytexl-v0.1.0 also publishes to PyPI. Publishing uses trusted
# publishing: on PyPI, add this repository and the workflow file `pytexl.yml` as a
# trusted publisher of the pytexl project, with the environment `pypi`.

name: pytexl

on:
  push:
    branches: [main]
    tags: ['pytexl-v*']
    paths: &paths
      - 'pytexl/**'
      - 'swan-core/**'
      - 'texl-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pytexl.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-22.04-arm, target: aarch64, manylinux: auto }
          - { runner: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path pytexl/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: windows-latest, target: x64, python_arch: x64 }
          - { runner: windows-11-arm, target: aarch64, python_arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path pytexl/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path pytexl/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path pytexl/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Installs the wheel built for each runner and runs the Python test suite against it,
  # on the oldest and newest supported Python. The musllinux wheels are not tested.
  test:
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
        python: ["3.10", "3.14"]
        exclude:
          # Python for Windows on ARM starts at 3.11
          - { runner: windows-11-arm, python: "3.10" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist --only-binary=pytexl pytexl
      - name: Run the tests
        working-directory: pytexl
        run: python -m unittest discover -v -s tests

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/pytexl-v') }}
    needs: [linux, windows, macos, sdist, test]
    environment: pypi
    permissions:
      # Used by PyPI trusted publishing and to sign the attestations
      id-token: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Check that the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#pytexl-v}"
          ls wheels-sdist/pytexl-"$version".tar.gz
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
