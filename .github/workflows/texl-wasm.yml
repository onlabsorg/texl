# Builds the texl-wasm package, tests it in headless Chrome, and publishes it to npm
# as @onlabsorg/texl.
#
# Pushing a tag like texl-wasm-v0.1.0 also publishes to npm. The tag version must match
# the crate version. Publishing uses trusted publishing: on npmjs.com, in the settings of
# the @onlabsorg/texl package, add this repository and the workflow file `texl-wasm.yml`
# as a trusted publisher, with the environment `npm`.

name: texl-wasm

on:
  push:
    branches: [main]
    tags: ['texl-wasm-v*']
    paths: &paths
      - 'texl-wasm/**'
      - 'swan-core/**'
      - 'texl-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE'
      - '.github/workflows/texl-wasm.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The test skips itself when Chrome or wasm-pack is missing, so check for them here
      - name: Find Chrome
        run: echo "TEXL_WASM_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Run the browser test
        run: |
          test -x "$TEXL_WASM_BROWSER"
          cargo test -p texl-wasm --test browser
      - name: Build the package
        run: |
          wasm-pack build texl-wasm --target web --release
          cp LICENSE texl-wasm/pkg/
          cd texl-wasm/pkg
          npm pkg set name=@onlabsorg/texl repository.directory=texl-wasm
          npm pack --dry-run
      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: texl-wasm/pkg

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/texl-wasm-v') }}
    needs: [build]
    environment: npm
    permissions:
      # Used by npm trusted publishing and to sign the provenance statement
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: pkg
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest
      - name: Check that the tag matches the package version
        working-directory: pkg
        run: test "$(npm pkg get version | tr -d '"')" = "${GITHUB_REF_NAME#texl-wasm-v}"
      - name: Publish to npm
        working-directory: pkg
        run: npm publish --access public
