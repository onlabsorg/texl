<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>texl-wasm tests</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --panel: #f0efed; --pass: #15803d; --fail: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #e7e5e4; --muted: #a8a29e; --panel: #292524; --pass: #4ade80; --fail: #f87171; }
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  p { color: var(--muted); margin-top: 0; }
  pre { background: var(--panel); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  ul { list-style: none; padding: 0; }
  li { font-family: ui-monospace, monospace; font-size: 13px; padding: .1rem 0; }
  .pass { color: var(--pass); }
  .fail { color: var(--fail); }
  #status { font-weight: 600; }
</style>
</head>
<body data-status="running">
<h1>texl-wasm tests</h1>
<p>Status: <span id="status">running…</span></p>

<h2>Checks</h2>
<ul id="checks"></ul>

<h2>Rendered document</h2>
<p><code>fixtures/sample.texl</code>, loaded with <code>engine.load</code>. Compared with <code>fixtures/sample.expected.txt</code>.</p>
<pre id="rendering"></pre>

<h2 id="expected-title" hidden>Expected document</h2>
<pre id="expected" hidden></pre>

<script type="module">
import init, { TexlEngine, collect } from "../../pkg/texl_wasm.js";

const checks = document.getElementById("checks");
let failures = 0;

/// Records the outcome of a check. `actual` and `expected` are compared with `===`.
function check(name, actual, expected) {
    const ok = actual === expected;
    if (!ok) failures++;
    const li = document.createElement("li");
    li.className = ok ? "pass" : "fail";
    li.textContent = ok
        ? `✓ ${name}`
        : `✗ ${name}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
    checks.append(li);
}

async function testSample() {
    const engine = new TexlEngine({
        origin: location.origin,
        site: { name: "Texl on the web", tags: ["swan", "texl", "wasm"] },
        shout: (s) => s.toUpperCase() + "!",
        slow_double: async (x) => {
            await new Promise((r) => setTimeout(r, 20));
            return 2 * x;
        },
        later: new Promise((r) => setTimeout(() => r(42), 10)),
    });
    check("engine.baseUrl defaults to the page URL", engine.baseUrl, location.href);

    const [doc, expected] = await Promise.all([
        engine.load("fixtures/sample.texl"),
        fetch("fixtures/sample.expected.txt").then((r) => r.text()),
    ]);
    const rendering = doc ? doc.rendering : "(the document could not be loaded)";
    document.getElementById("rendering").textContent = rendering;
    check("sample.texl renders as sample.expected.txt", rendering, expected);
    if (rendering !== expected) {
        document.getElementById("expected-title").hidden = false;
        document.getElementById("expected").hidden = false;
        document.getElementById("expected").textContent = expected;
    }

    check("load gives the document URI", doc?.uri, new URL("fixtures/sample.texl", location.href).href);
    check("load gives the document source", typeof doc?.source, "string");
    check("load gives the document data", doc?.data?.title, "Texl Sample Document");
    check("load of a missing document gives null", await engine.load("fixtures/missing.texl"), null);
}

async function testEngine() {
    const engine = new TexlEngine({ a: 10 }, "http://127.0.0.1:1/some/doc.texl");
    check("an explicit base URL is used", engine.baseUrl, "http://127.0.0.1:1/some/doc.texl");
    const draft = await engine.render("draft.texl", "a = <% a %>");
    check("render uses the engine globals", draft.rendering, "a = 10");
    check("render resolves its URI against the base URL", draft.uri, "http://127.0.0.1:1/some/draft.texl");
    check("render gives the source", draft.source, "a = <% a %>");

    engine.set("b", 32);
    check("set adds a global", (await engine.render("doc.texl", "<% a + b %>")).rendering, "42");
    const first = await engine.render("doc.texl", "<% x = 1 %><% x %>|");
    const second = await engine.render("doc.texl", "[<% x %>]");
    check("render starts from a fresh scope", first.rendering + second.rendering, "1|[]");
    check("render gives the data", first.data.x, 1);

    const page = new TexlEngine();
    const counted = "fixtures/partials/counted.texl";
    check(
        "render resolves imports against its URI",
        (await page.render("fixtures/partials/new.texl", '<% texl.import("signature.texl") ~> (doc -> doc.uri) %>')).rendering,
        new URL("fixtures/partials/signature.texl", location.href).href);
    check(
        "render fetches absolute paths from the root of its URI",
        (await page.render("fixtures/new.texl", '<% texl.import("/tests/web/fixtures/partials/counted.texl") ~> (doc -> doc.rendering) %>')).rendering,
        "counted.texl has been evaluated 1 time(s)\n");
    check(
        "a self-import gives Undefined",
        (await page.render("fixtures/self.texl", '[<% texl.import("self.texl#top") %>]')).rendering,
        "[[[Undefined]]]");
    check(
        "unreachable documents give Nothing",
        (await page.render("fixtures/new.texl", '[<% texl.import("/nowhere.texl") %>]')).rendering,
        "[]");

    const source = await page.fetch(counted);
    check("fetch gives the source", source, await fetch(counted).then((r) => r.text()));
    check("fetch of a missing document gives null", await page.fetch("fixtures/missing.texl"), null);
    check(
        "load is fetch followed by render",
        (await page.load(counted)).rendering,
        (await page.render(counted, source)).rendering);

    for (const method of ["fetch", "load"]) {
        let rejected = false;
        try { await page[method]("http://[bad"); } catch { rejected = true; }
        check(`${method} rejects an invalid URI`, rejected, true);
    }
    let rejected = false;
    try { await page.render("http://[bad", ""); } catch { rejected = true; }
    check("render rejects an invalid URI", rejected, true);

    let threw = false;
    try { new TexlEngine({}, "not a url"); } catch { threw = true; }
    check("an invalid base URL throws", threw, true);
}

async function testContext() {
    const engine = new TexlEngine({ g: "global" });
    const context = engine.createContext({
        a: 10,
        b: 20,
        name: "World",
        double: (x) => 2 * x,
        asyncDouble: async (x) => 2 * x,
    });

    check("names lists the context bindings", context.names().join(","), "a,asyncDouble,b,double,name,texl");
    check("get reads a binding", context.get("a"), 10);
    context.set("c", 30);
    check("set adds a binding", context.get("c"), 30);

    check("render interpolates", await context.render("Hello <% name %>!"), "Hello World!");
    check("render sees the engine globals", await context.render("<% g %>"), "global");
    check("render evaluates arithmetic", await context.render("Sum: <% a + b + c %>"), "Sum: 60");
    check("render calls JS functions", await context.render("<% double(a) %>"), "20");
    check("render awaits async JS functions", await context.render("<% asyncDouble(a) %>"), "20");

    await context.render("<% x = a * 5 %><% y : b + 10 %>");
    check("assignments persist in the context", context.get("x"), 50);
    check("labels persist in the context", context.get("y"), 30);

    context.set("later", new Promise((r) => setTimeout(() => r(42), 10)));
    check("JS promises are awaited", await context.render("<% later %>"), "42");
    context.set("bad", Promise.reject(new Error("boom")));
    check("rejected promises give Nothing", await context.render("[<% bad %>]"), "[]");
    context.set("badFn", async () => { throw new Error("boom"); });
    check("throwing async functions give Nothing", await context.render("[<% badFn(1) %>]"), "[]");

    await context.render("<% r = asyncDouble(a) %>");
    const r = context.get("r");
    check("Swan promises come back as JS promises", r instanceof Promise, true);
    check("Swan promises resolve in JS", await r, 20);

    check("contexts cannot import", Object.keys(context.get("texl")).length, 0);
}

async function testCollect() {
    const engine = new TexlEngine();
    collect();

    // A function stored in the context holds its scope: a reference cycle
    const kept = engine.createContext({ rate: 2 });
    await kept.render("<% convert = a -> a * rate %>");
    const dropped = engine.createContext();
    await dropped.render("<% f = x -> x %>");
    dropped.free();

    check("collect frees the scopes of freed contexts", collect() > 0, true);
    check("collect keeps the contexts in use", await kept.render("<% convert 10 %>"), "20");
    check("collect has nothing left to free", collect(), 0);
}

const status = document.getElementById("status");
try {
    await init();
    await testSample();
    await testEngine();
    await testContext();
    await testCollect();
} catch (err) {
    failures++;
    check(`unexpected error: ${err}`, false, true);
}
status.textContent = failures === 0 ? "all checks passed" : `${failures} check(s) failed`;
status.className = failures === 0 ? "pass" : "fail";
document.body.dataset.status = failures === 0 ? "pass" : "fail";
</script>
</body>
</html>
