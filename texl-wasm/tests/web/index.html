<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>texl-wasm tests</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --panel: #f0efed; --pass: #15803d; --fail: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #e7e5e4; --muted: #a8a29e; --panel: #292524; --pass: #4ade80; --fail: #f87171; }
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  p { color: var(--muted); margin-top: 0; }
  pre { background: var(--panel); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  ul { list-style: none; padding: 0; }
  li { font-family: ui-monospace, monospace; font-size: 13px; padding: .1rem 0; }
  .pass { color: var(--pass); }
  .fail { color: var(--fail); }
  #status { font-weight: 600; }
</style>
</head>
<body data-status="running">
<h1>texl-wasm tests</h1>
<p>Status: <span id="status">running…</span></p>

<h2>Checks</h2>
<ul id="checks"></ul>

<h2>Rendered document</h2>
<p><code>fixtures/sample.texl</code>, loaded with <code>engine.load</code>. Compared with <code>fixtures/sample.expected.txt</code>.</p>
<pre id="rendering"></pre>

<h2 id="expected-title" hidden>Expected document</h2>
<pre id="expected" hidden></pre>

<script type="module">
import init, { TexlEngine, Tuple, collect, isUndefined, normalize } from "../../pkg/texl_wasm.js";

const checks = document.getElementById("checks");
let failures = 0;

/// Records the outcome of a check. `actual` and `expected` are compared with `===`.
function check(name, actual, expected) {
    const ok = actual === expected;
    if (!ok) failures++;
    const li = document.createElement("li");
    li.className = ok ? "pass" : "fail";
    li.textContent = ok
        ? `✓ ${name}`
        : `✗ ${name}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
    checks.append(li);
}

async function testSample() {
    const engine = new TexlEngine({
        origin: location.origin,
        site: { name: "Texl on the web", tags: ["swan", "texl", "wasm"] },
        shout: (s) => s.toUpperCase() + "!",
        slow_double: async (x) => {
            await new Promise((r) => setTimeout(r, 20));
            return 2 * x;
        },
        later: new Promise((r) => setTimeout(() => r(42), 10)),
    });
    check("engine.baseUrl defaults to the page URL", engine.baseUrl, location.href);

    const [doc, expected] = await Promise.all([
        engine.load("fixtures/sample.texl"),
        fetch("fixtures/sample.expected.txt").then((r) => r.text()),
    ]);
    const rendering = doc ? doc.text : "(the document could not be loaded)";
    document.getElementById("rendering").textContent = rendering;
    check("sample.texl renders as sample.expected.txt", rendering, expected);
    if (rendering !== expected) {
        document.getElementById("expected-title").hidden = false;
        document.getElementById("expected").hidden = false;
        document.getElementById("expected").textContent = expected;
    }

    check("load gives the document URI", doc?.uri, new URL("fixtures/sample.texl", location.href).href);
    check("load gives the document source", typeof doc?.source, "string");
    check("load gives the document data", doc?.data?.title, "Texl Sample Document");
    {
        const url = new URL("fixtures/missing.texl", location.href).href;
        const failed = await engine.load("fixtures/missing.texl").catch((err) => err);
        check("load of a missing document rejects with an Error", failed instanceof Error, true);
        check("a failed load is a LoadError", failed.name, "LoadError");
        check("a failed load gives its message", failed.message, `cannot load \`${url}\`: HTTP status 404`);
        check("a failed load gives its URL", failed.uri, url);
        check("a failed load gives the reason", failed.reason, "HTTP status 404");
    }
}

async function testEngine() {
    const engine = new TexlEngine({ a: 10 }, "http://127.0.0.1:1/some/doc.texl");
    check("an explicit base URL is used", engine.baseUrl, "http://127.0.0.1:1/some/doc.texl");
    const draft = await engine.render("draft.texl", "a = <% a %>");
    check("render uses the engine globals", draft.text, "a = 10");
    check("render resolves its URI against the base URL", draft.uri, "http://127.0.0.1:1/some/draft.texl");
    check("render gives the source", draft.source, "a = <% a %>");

    engine.set("b", 32);
    check("set adds a global", (await engine.render("doc.texl", "<% a + b %>")).text, "42");
    const first = await engine.render("doc.texl", "<% x = 1 %><% x %>|");
    const second = await engine.render("doc.texl", "[<% x %>]");
    check("render starts from a fresh scope", first.text + second.text, "1|[]");
    check("render gives the data", first.data.x, 1);

    const page = new TexlEngine();
    const counted = "fixtures/partials/counted.texl";
    check(
        "render resolves imports against its URI",
        (await page.render("fixtures/partials/new.texl", '<% texl.import("signature.texl") ~> (doc -> doc.uri) %>')).text,
        new URL("fixtures/partials/signature.texl", location.href).href);
    check(
        "render fetches absolute paths from the root of its URI",
        (await page.render("fixtures/new.texl", '<% texl.import("/tests/web/fixtures/partials/counted.texl") ~> (doc -> doc.text) %>')).text,
        "counted.texl has been evaluated 1 time(s)\n");
    check(
        "a self-import gives Undefined",
        (await page.render("fixtures/self.texl", '[<% texl.import("self.texl#top") %>]')).text,
        "[[[Undefined]]]");
    check(
        "unreachable documents give Undefined",
        (await page.render("fixtures/new.texl", '[<% texl.import("/nowhere.texl") %>]')).text,
        "[[[Undefined]]]");
    {
        const failed = await (await page.render("fixtures/new.texl", '<% x = texl.import("/nowhere.texl") %>')).data.x;
        check("a failed import is undefined", isUndefined(failed), true);
        check("a failed import names its operation", failed.op, "document.load");
        check("a failed import gives its URL", failed.lhv, new URL("/nowhere.texl", location.href).href);
        check("a failed import gives the reason", failed.rhv, "HTTP status 404");
    }

    const source = await page.fetch(counted);
    check("fetch gives the source", source, await fetch(counted).then((r) => r.text()));
    {
        const failed = await page.fetch("fixtures/missing.texl").catch((err) => err);
        check("fetch of a missing document rejects with an Error", failed instanceof Error, true);
        check("a failed fetch is a LoadError", failed.name, "LoadError");
        check("a failed fetch gives the reason", failed.reason, "HTTP status 404");
    }
    check(
        "load is fetch followed by render",
        (await page.load(counted)).text,
        (await page.render(counted, source)).text);

    for (const method of ["fetch", "load"]) {
        let rejected = false;
        try { await page[method]("http://[bad"); } catch (err) { rejected = err instanceof Error; }
        check(`${method} rejects an invalid URI`, rejected, true);
    }
    let rejected = false;
    try { await page.render("http://[bad", ""); } catch (err) { rejected = err instanceof Error; }
    check("render rejects an invalid URI", rejected, true);

    let threw = false;
    try { new TexlEngine({}, "not a url"); } catch { threw = true; }
    check("an invalid base URL throws", threw, true);
}

async function testContext() {
    const engine = new TexlEngine({ g: "global" });
    const context = engine.createContext({
        a: 10,
        b: 20,
        name: "World",
        double: (x) => 2 * x,
        asyncDouble: async (x) => 2 * x,
    });

    check("names lists the context bindings", context.names().join(","), "a,asyncDouble,b,double,name,texl");
    check("get reads a binding", context.get("a"), 10);
    context.set("c", 30);
    check("set adds a binding", context.get("c"), 30);

    check("render interpolates", (await context.render("Hello <% name %>!")).text, "Hello World!");
    check("render sees the engine globals", (await context.render("<% g %>")).text, "global");
    check("render evaluates arithmetic", (await context.render("Sum: <% a + b + c %>")).text, "Sum: 60");
    check("render calls JS functions", (await context.render("<% double(a) %>")).text, "20");
    check("render awaits async JS functions", (await context.render("<% asyncDouble(a) %>")).text, "20");

    await context.render("<% x = a * 5 %><% y : b + 10 %>");
    check("assignments persist in the context", context.get("x"), 50);
    check("labels persist in the context", context.get("y"), 30);

    context.set("later", new Promise((r) => setTimeout(() => r(42), 10)));
    check("JS promises are awaited", (await context.render("<% later %>")).text, "42");
    context.set("bad", Promise.reject(new Error("boom")));
    check("rejected promises give Undefined", (await context.render("<% bad %>")).text, "[[Undefined]]");
    context.set("badFn", async () => { throw new Error("boom"); });
    const badAsync = (await context.render("<% badFn(1) %>")).tags[0].value;
    check("throwing async functions give Undefined", badAsync.error, "Error: boom");
    check("their error has the position of the call", badAsync.pos, 8);
    context.set("throwing", () => { throw new TypeError("boom"); });
    const thrown = (await context.render("<% throwing(1) %>")).tags[0].value;
    check("throwing functions give Undefined", isUndefined(thrown), true);
    check("their error has a type", thrown.type, "HostError");
    check("their error is the one thrown", thrown.error, "TypeError: boom");
    check("their error is described", thrown.description, "host error: TypeError: boom");
    check("their error has the position of the call", thrown.pos, 11);
    context.set("throwsText", () => { throw "plain"; });
    check("any thrown value is an error", (await context.render("<% throwsText() %>")).tags[0].value.error, "plain");
    context.set("throwsOdd", () => { throw Object.create(null); });
    check("a thrown value without a text is an error", (await context.render("<% throwsOdd() %>")).tags[0].value.error, "unknown error");
    context.set("badResult", () => ({ get x() { throw new Error("getter"); } }));
    check("a result that throws when read is an error", (await context.render("<% badResult() %>")).tags[0].value.error, "Error: getter");

    await context.render("<% r = asyncDouble(a) %>");
    const r = context.get("r");
    check("Swan promises come back as JS promises", r instanceof Promise, true);
    check("Swan promises resolve in JS", await r, 20);

    check("contexts cannot import", Object.keys(context.get("texl")).length, 0);
}

async function testCollect() {
    const engine = new TexlEngine();
    collect();

    // A function stored in the context holds its scope: a reference cycle
    const kept = engine.createContext({ rate: 2 });
    await kept.render("<% convert = a -> a * rate %>");
    const dropped = engine.createContext();
    await dropped.render("<% f = x -> x %>");
    dropped.free();

    check("collect frees the scopes of freed contexts", collect() > 0, true);
    check("collect keeps the contexts in use", (await kept.render("<% convert 10 %>")).text, "20");
    check("collect has nothing left to free", collect(), 0);
}

async function testDebug() {
    const engine = new TexlEngine();
    const source = 'µ° è <% y = "a" - 1 %>😀 <% y %>!';
    const doc = await engine.render("debug.texl", source);
    check("tags has one entry per tag", doc.tags.length, 2);
    const [assign, show] = doc.tags;
    check("a tag that renders nothing is in tags", source.slice(assign.start, assign.end), '<% y = "a" - 1 %>');
    check("tag spans are UTF-16 indices of the source", source.slice(show.start, show.end), "<% y %>");
    check("tag output spans are UTF-16 indices of the text", doc.text.slice(show.out_start, show.out_end), "[[Undefined]]");
    const u = show.value;
    check("undefined values reach JS", isUndefined(u), true);
    check("undefined values have a type", u.type, "BinaryOperation");
    check("undefined values have a description", u.description, 'cannot subtract the number `1` from the text `"a"`');
    check("undefined values have their operands", [u.op, u.lhv, u.rhv].join("|"), "subtraction|a|1");
    check("pos is a UTF-16 index of the source", source[u.pos], "-");
    check("source is the text pos indexes", u.source, source);
    check("source is a getter", typeof Object.getOwnPropertyDescriptor(u, "source").get, "function");
    check("source is listed with the other members", Object.keys(u).includes("source"), true);
    check("a copy of the object has the source", ({ ...u }).source, source);
    check("uri is the document URL", u.uri, new URL("debug.texl", location.href).href);
    check("data has the same value", doc.data.y.pos, u.pos);
    const parsed = (await engine.render("d.texl", '<% (parse "(1 + 2") {} %>')).tags[0].value;
    check("source of parsed code is the parsed text", [parsed.source, parsed.uri].join("|"), "(1 + 2|");
    const onPurpose = (await engine.render("d.texl", "<% undef.from 1 %>")).tags[0].value;
    check("a value made on purpose has no source", onPurpose.source, null);
    check("undefined values are frozen", Object.isFrozen(u), true);
    check("plain objects are not undefined values", isUndefined({ ...u }), false);

    const nested = (await engine.render("debug.texl", '<% 2 * ("a" - 1) %>')).tags[0].value;
    check("cause leads to the root cause", nested.cause.description, 'cannot subtract the number `1` from the text `"a"`');
    check("cause is the undefined operand", nested.cause, nested.rhv);
    check("a root cause has no cause", nested.cause.cause, null);
    check("built-in errors have the position of the call", (await engine.render("d.texl", "<% math.sqrt(-1) %>")).tags[0].value.pos, 12);
    const late = await engine.render("d.texl", '<% 1 ~> (x -> x - "a") %>');
    check("errors through promises are rendered", late.text, "[[Undefined]]");
    check("errors through promises keep their details", late.tags[0].value.op, "subtraction");

    const context = engine.createContext();
    context.set("back", u);
    check("undefined values go back to Swan", (await context.render("<% type back %>|<% back %>")).text, "Undefined|[[Undefined]]");
    check("they keep their details", (await context.render("<% (undef.inspect back).op %>")).text, "subtraction");
    const rendering = await context.render("° <% b = 1 %><% b + 1 %>");
    check("context renderings have text", rendering.text, "° 2");
    check("context renderings have data", rendering.data.b, 1);
    const roundTrip = engine.createContext();
    const emoji = { uri: "d", source: "😀 <% 1 %>", data: {}, text: "😀 1", tags: [{ start: 3, end: 10, out_start: 3, out_end: 4, value: 1 }] };
    roundTrip.set("lib", emoji);
    const back = roundTrip.get("lib").tags[0];
    check("a document passed back keeps its tag positions", [back.start, back.end, back.out_start, back.out_end].join(), "3,10,3,4");
    check("Swan holds a document's tag positions in bytes", (await roundTrip.render("<% (lib.tags 0).start %>")).text, "5");
    check("context renderings have tags", [rendering.tags[1].start, rendering.tags[1].value].join(), "13,2");
}

async function testTuples() {
    const received = [];
    const engine = new TexlEngine({
        pair: Tuple.of(1, 2),
        items: [1, 2],
        mixed: [Tuple.of(1, 2), [3, 4]],
        receive: (arg) => { received.push(arg); return arg; },
        makeTuple: () => Tuple.of("a", "b"),
        makeArray: () => ["a", "b"],
        later: async () => Tuple.of(5, 6),
    });
    const context = engine.createContext();
    const type = async (expr) => (await context.render(`<% ${expr} %>`)).text;

    check("a Swan tuple is a Tuple", (await context.render("<% t = (1, 2) %>")).data.t instanceof Tuple, true);
    check("a Tuple is an Array", Array.isArray(Tuple.of(1, 2)), true);
    check("a Swan list is not a Tuple", (await context.render("<% l = [1, 2] %>")).data.l instanceof Tuple, false);
    check("a Swan list is an Array", Array.isArray(context.get("l")), true);
    check("a Tuple reads like an array", Array.from(context.get("t")).join(), "1,2");

    check("a Tuple becomes a Swan tuple", await type("pair"), "1, 2");
    check("Swan sees a Tuple as a tuple", await type("pair + pair"), "2, 4");
    check("an array becomes a Swan list", await type("items 1"), "2");
    check("a JS function can return a Tuple", await type("makeTuple()"), "a, b");
    check("a JS function can return a list", await type("makeArray() 1"), "b");

    context.set("t2", Tuple.of(1, 2));
    check("context.set keeps a Tuple", context.get("t2") instanceof Tuple, true);
    context.set("l2", [1, 2]);
    check("context.set keeps a list", context.get("l2") instanceof Tuple, false);
    check("a tuple round-trips", context.get("t") instanceof Tuple, true);
    check("a Tuple in an array is spread", (await context.render("<% m = mixed %>")).data.m.length, 3);
    check("a list in a list stays a list", Array.isArray(context.get("m")[2]), true);

    await context.render("<% receive(1, 2) %><% receive [1, 2] %>");
    check("a call with several arguments passes a Tuple", received[0] instanceof Tuple, true);
    check("a call with a list passes an array", received[1] instanceof Tuple, false);
    const [a, b] = received[0];
    check("a Tuple argument destructures", a + b, 3);
    check("a promised Tuple becomes a tuple", (await context.render("<% later() %>")).tags[0].value instanceof Tuple, true);

    context.set("one", Tuple.of(7));
    check("a Tuple of one item is that item", context.get("one"), 7);
    context.set("none", new Tuple());
    check("an empty Tuple is Nothing", context.get("none"), null);
    check("array methods keep the class", Tuple.of(1, 2).map((x) => x) instanceof Tuple, true);
    context.set("flat", Tuple.of(1, Tuple.of(2, 3), null, 4));
    check("a Tuple is flattened and drops null", context.get("flat").join(), "1,2,3,4");
    context.set("gaps", [1, null, 2, undefined, new Tuple()]);
    check("an array drops null and undefined", JSON.stringify(context.get("gaps")), "[1,2]");
    context.set("deep", { a: [[null, 1]], n: null });
    check("nested arrays are normalized", JSON.stringify(context.get("deep").a), "[[1]]");
    check("null members of an object are kept", context.get("deep").n, null);
}

async function testNormalize() {
    const show = (v) => JSON.stringify(v);
    check("normalize flattens a Tuple", show(normalize(Tuple.of(1, Tuple.of(2, 3), null))), "[1,2,3]");
    check("normalize keeps the Tuple class", normalize(Tuple.of(1, 2)) instanceof Tuple, true);
    check("normalize of one item gives that item", normalize(Tuple.of(null, 7)), 7);
    check("normalize of no items gives null", normalize(new Tuple()), null);
    check("normalize of undefined gives null", normalize(undefined), null);
    check("normalize spreads Tuples in arrays", show(normalize([Tuple.of(1, 2), [3, null], null])), "[1,2,[3]]");
    check("normalize keeps arrays as arrays", normalize([1, 2]) instanceof Tuple, false);
    check("normalize goes through plain objects", show(normalize({ a: [null, 1], t: Tuple.of(2), n: null })), '{"a":[1],"t":2,"n":null}');
    const input = [1, null];
    normalize(input);
    check("normalize leaves its argument as it was", input.length, 2);
    const fn = () => 1, promise = Promise.resolve(1), date = new Date();
    check("normalize returns functions as they are", normalize(fn), fn);
    check("normalize returns promises as they are", normalize(promise), promise);
    check("normalize returns class instances as they are", normalize(date), date);

    const context = new TexlEngine().createContext();
    await context.render('<% u = 1 + "a" %>');
    const u = context.get("u");
    check("the value is undefined", isUndefined(u), true);
    check("normalize returns undefined values as they are", normalize(u), u);
    for (const value of [Tuple.of(1, [null, Tuple.of(2, 3)], null), [Tuple.of(), [Tuple.of(4)], 5], { a: [null], b: { c: Tuple.of(null, 1) } }]) {
        context.set("v", value);
        check(`normalize gives what comes back from Swan: ${show(value)}`, show(normalize(value)), show(context.get("v")));
    }
}

const status = document.getElementById("status");
try {
    await init();
    await testSample();
    await testEngine();
    await testContext();
    await testCollect();
    await testDebug();
    await testTuples();
    await testNormalize();
} catch (err) {
    failures++;
    check(`unexpected error: ${err}`, false, true);
}
status.textContent = failures === 0 ? "all checks passed" : `${failures} check(s) failed`;
status.className = failures === 0 ? "pass" : "fail";
document.body.dataset.status = failures === 0 ? "pass" : "fail";
</script>
</body>
</html>
