[package]
name = "texl-wasm"
version = "0.1.0"
edition = "2024"
description = "Text templates with Swan expressions: the JavaScript library of Texl, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/onlabsorg/texl"
homepage = "https://onlabsorg.github.io/texl/book/hosts/javascript.html"
readme = "README.md"
keywords = ["template", "templating", "wasm", "texl", "swan"]
categories = ["template-engine", "wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
url = "2"
swan-core = { path = "../swan-core" }
texl-core = { path = "../texl-core" }
