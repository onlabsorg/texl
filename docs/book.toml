[book]
title = "Texl"
description = "Text templates with Swan expressions"
authors = ["Marcello Del Buono"]
language = "en"
src = "src"

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/onlabsorg/texl"
edit-url-template = "https://github.com/onlabsorg/texl/edit/main/docs/{path}"
site-url = "/texl/book/"
additional-css = ["assets/texl.css", "assets/book.css"]
additional-js = ["assets/texl-highlight.js", "assets/book.js"]

[output.html.search]
limit-results = 20
